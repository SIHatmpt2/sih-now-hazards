services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: [.env]
    command: ["sh","-c","alembic upgrade head && uvicorn apps.main:app --host 0.0.0.0 --port 8001"]
    ports: ["8001:8001"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_started}
    restart: unless-stopped
    healthcheck:
      test: ["CMD","curl","-fsS","http://127.0.0.1:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build: {context: ., dockerfile: Dockerfile}
    command: ["celery","-A","apps.tasks.celery_app","worker","--loglevel=INFO"]
    env_file: [.env]
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
      minio: {condition: service_started}
    restart: unless-stopped
  beat:
    build: {context: ., dockerfile: Dockerfile}
    command: ["celery","-A","apps.tasks.celery_app","beat","--loglevel=INFO"]
    env_file: [.env]
    depends_on: {redis: {condition: service_healthy}}
    restart: unless-stopped
  postgres:
    image: postgis/postgis:16-3.4
    env_file: [.env]
    ports: ["5433:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server","--appendonly","yes"]
    ports: ["6380:6379"]
    volumes: [redis_data:/data]
    healthcheck: {test: ["CMD","redis-cli","ping"], interval: 10s, timeout: 3s, retries: 5}
    restart: unless-stopped
  minio:
    image: minio/minio:latest
    command: ["server","/data","--console-address",":9002"]
    env_file: [.env]
    ports: ["9001:9000","9002:9002"]
    volumes: [minio_data:/data]
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  minio_data:
